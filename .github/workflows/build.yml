# This workflow will build a .NET project added
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "dev-branch" ]
  pull_request:
    branches: [ "dev-branch" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Ensure publish directory exists 
      run: mkdir -p ./publish

    - name: Publish
      run: dotnet publish --configuration Release --output ./publish

    - name: Set up JFrog CLI
      uses: jfrog/setup-jfrog-cli@v1
      with:
        version: '1.48.0'

    - name: Upload to JFrog Artifactory
      run: jfrog rt u "publish/*" "qajfrog-demodryrun/" --url=https://tmhome.jfrog.io/artifactory --user=${{ secrets.JFROG_USER }} --password=${{ secrets.JFROG_PASSWORD }} --flat=false
